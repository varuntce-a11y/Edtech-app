name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: upskillin
          POSTGRES_PASSWORD: upskillin
          POSTGRES_DB: upskillin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U upskillin -d upskillin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://upskillin:upskillin@localhost:5432/upskillin?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
      OTP_HASH_SECRET: ci-only-otp-secret-not-for-production
      PAYMENT_PROVIDER: simulated
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate -w @upskillin/api
      - run: npm run prisma:migrate -w @upskillin/api -- --name init
      - run: npm run prisma:seed -w @upskillin/api
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @upskillin/web
